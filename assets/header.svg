<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E1E1E"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0B0B" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0B0B0B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B0B0B" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,monospace; }
      .in { opacity: 0; animation: in 0.8s ease-out forwards; }
      .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.4s; }
      .d3 { animation-delay: 0.7s; } .d4 { animation-delay: 1s; }
      @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(260px); } }
    </style>
  </defs>

  <rect width="900" height="240" fill="#0B0B0B"/>
  <rect width="900" height="240" fill="url(#dots)"/>
  <rect width="900" height="240" fill="url(#fade)"/>
  <rect class="scan" x="0" y="0" width="900" height="1" fill="#F8F8F8" opacity="0.06"/>
  <rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#2A2A2A"/>

  <!-- terminal chrome -->
  <circle cx="24" cy="20" r="4" fill="none" stroke="#555555"/>
  <circle cx="40" cy="20" r="4" fill="none" stroke="#555555"/>
  <circle cx="56" cy="20" r="4" fill="none" stroke="#555555"/>
  <text x="450" y="24" class="mono" font-size="11" fill="#555555" text-anchor="middle" letter-spacing="1">~/jitendra — zsh</text>

  <g class="in d1" transform="translate(60,72) scale(3.2)">
    <path d="M16,7 L16,14 L23,10 L16,18 L23,22 L16,26 Q10,26 9,21"
          stroke="#F8F8F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="23" cy="10" r="2" fill="#F8F8F8"/>
    <circle cx="23" cy="22" r="2" fill="#F8F8F8"/>
  </g>

  <text x="200" y="110" class="mono in d2" font-size="34" font-weight="700" fill="#F8F8F8" letter-spacing="1">JITENDRA KUMAR SAINI</text>
  <text x="201" y="137" class="mono in d3" font-size="14" font-weight="500" fill="#AAAAAA" letter-spacing="3">AI/ML ENGINEER &#183; PYTHON DEVELOPER &#183; LLM ORCHESTRATION</text>

  <text x="201" y="175" class="mono in d4" font-size="15" fill="#666666">&gt; building intelligent systems</text>
  <rect x="485" y="162" width="9" height="16" fill="#F8F8F8">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="60" y1="208" x2="840" y2="208" stroke="#2A2A2A" stroke-width="1"/>
  <text x="60" y="226" class="mono" font-size="11" fill="#555555" letter-spacing="1">JAIPUR, RAJASTHAN, IN</text>
  <text x="450" y="226" class="mono" font-size="11" fill="#555555" letter-spacing="1" text-anchor="middle">OPEN TO REMOTE</text>
  <text x="840" y="226" class="mono" font-size="11" fill="#555555" letter-spacing="1" text-anchor="end">B.TECH AI &#38; DS &#183; 2026</text>
</svg>
