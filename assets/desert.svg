<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8F8F8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F8F8F8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="420" fill="#0B0B0B"/>

  <!-- stars -->
  <circle cx="90" cy="60" r="1.6" fill="#F8F8F8" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="105" r="1.3" fill="#F8F8F8" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="50" r="1.5" fill="#F8F8F8" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- sunset -->
  <circle cx="680" cy="170" r="160" fill="url(#sunGlow)"/>
  <circle cx="680" cy="170" r="85" fill="#F8F8F8"/>

  <!-- dune layers, back to front -->
  <path d="M0,300 L100,280 L220,295 L360,265 L520,290 L680,270 L820,285 L900,275 L900,420 L0,420 Z" fill="#555555"/>
  <path d="M0,340 L120,315 L280,335 L440,305 L600,330 L760,310 L900,325 L900,420 L0,420 Z" fill="#333333"/>
  <path d="M0,375 L140,352 L300,372 L460,348 L640,368 L820,350 L900,360 L900,420 L0,420 Z" fill="#1A1A1A"/>

  <!-- footprints, trailing behind -->
  <circle cx="480" cy="367" r="2.2" fill="#888888" opacity="0.5"/>
  <circle cx="455" cy="368" r="2.2" fill="#888888" opacity="0.4"/>
  <circle cx="430" cy="369" r="2" fill="#888888" opacity="0.3"/>
  <circle cx="405" cy="369" r="2" fill="#888888" opacity="0.2"/>
  <circle cx="380" cy="370" r="1.8" fill="#888888" opacity="0.12"/>

  <!-- camel: continuous wireframe silhouette, same visual language as the logo mark -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;235 0" dur="16s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.55s" repeatCount="indefinite"/>
      <g transform="translate(500,248) scale(1.3)">
        <path d="M20,50 L34,52 L52,18 L68,48 L78,30 L100,22 L118,34
                 M118,34 L108,42
                 M20,50 L10,60
                 M100,50 L60,58 L30,55
                 M100,50 L108,90
                 M85,52 L80,75 L88,90
                 M40,55 L48,90
                 M22,54 L14,78 L20,90"
              stroke="#F8F8F8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="108" cy="90" r="2" fill="#F8F8F8"/>
        <circle cx="88" cy="90" r="2" fill="#F8F8F8"/>
        <circle cx="48" cy="90" r="2" fill="#F8F8F8"/>
        <circle cx="20" cy="90" r="2" fill="#F8F8F8"/>
      </g>
    </g>
  </g>
</svg>
